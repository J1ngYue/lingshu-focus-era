<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2e9"><meta name="description" content="把认真生活的每一天，变成科技、修仙与术法世界的成长。">
  <title>灵枢 · 专注纪元</title>
  <link rel="icon" href="assets/ink/app.ico" type="image/x-icon"><link rel="stylesheet" href="game.css"><link rel="stylesheet" href="polish.css"><link rel="stylesheet" href="ink.css"><link rel="stylesheet" href="feedback.css"><link rel="stylesheet" href="battle.css">
  <script src="data.js" defer></script><script src="engine.js" defer></script><script src="ink-art.js" defer></script><script src="pixel-motion.js" defer></script><script src="ink-scene.js" defer></script><script src="feedback.js" defer></script><script src="tree.js" defer></script><script src="app.js" defer></script>
</head>
<body>
  <canvas id="game-world" class="world-canvas" aria-label="横屏仙侠角色与怪兽自动战斗场景"></canvas>
  <div class="world-vignette" aria-hidden="true"></div>
  <header class="game-hud"><button class="player-plaque" data-action="navigate" data-view="jobs" aria-label="查看角色与转职"><img src="assets/ink/Knight-idle.png" alt=""><span><strong id="hud-name">小灵</strong><small id="hud-realm">三道学徒 · 凡人初心</small><span class="power-line">战力 <strong id="hud-power">57</strong></span><span class="progress"><span id="hud-xp"></span></span></span><b id="hud-level">1</b></button>
    <div class="game-logo"><img src="assets/pixel/ui/bolt.png" alt=""><span>灵枢<small>每一次专注，都是一次成长</small></span></div>
    <button class="back-home" id="back-home" data-action="navigate" data-view="home" hidden>← 返回营地 <kbd>Esc</kbd></button>
    <div class="resource-hud"><span title="完成事项与专注获得">✦ <b id="hud-points">20</b><small>灵感</small></span><span title="挂机收集锻造材料">◆ <b id="hud-coins">40</b><small>灵石</small></span><span>✧ <b id="hud-shards">0</b><small>星屑</small></span><button class="icon-button" data-action="quiet" aria-label="切换静心模式" title="静心模式" id="quiet-button"></button><button class="icon-button" data-action="fullscreen" aria-label="全屏游戏" title="全屏游戏">⛶</button><button class="icon-button" data-action="navigate" data-view="settings" aria-label="修行设置" id="settings-nav"></button></div>
  </header>
  <main id="content" tabindex="-1"></main>
  <footer class="game-dock"><div class="dock-status"><span id="date-label"></span><div class="local-status" id="save-status"><span></span> 进度已保存在本机</div></div><nav id="navigation" aria-label="主导航"></nav><div class="dock-focus"><button class="button primary" data-action="focus-jump">进入专注</button><small id="dock-timer">今日修行 0 分钟</small></div></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="task-dialog" aria-labelledby="task-dialog-title"><form id="task-form"><div class="dialog-heading"><h2 id="task-dialog-title">添加今日事项</h2><button type="button" class="icon-button" data-action="close-dialog" data-dialog="task-dialog" aria-label="关闭">×</button></div><p class="muted">设定一件具体的小事，让今天的自己更进一步。</p><input type="hidden" name="id"><label>事项名称<input name="title" placeholder="例如：读完第三章并整理笔记" maxlength="100" required autocomplete="off"></label><div class="form-grid"><label>预计时长（分钟）<input name="minutes" type="number" min="5" max="180" value="25" required></label><label>事项类型<select name="category"><option>学习</option><option>练习</option><option>复盘</option><option>生活</option></select></label></div><div class="hint-box">完成后按预计时长获得灵感点数；专注计时还会额外奖励学习时间。</div><div class="dialog-actions"><button type="button" class="button secondary" data-action="close-dialog" data-dialog="task-dialog">取消</button><button class="button primary" type="submit">保存事项</button></div></form></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"><div class="dialog-heading"><h2 id="confirm-title"></h2><button class="icon-button" data-action="close-dialog" data-dialog="confirm-dialog" aria-label="关闭">×</button></div><p id="confirm-text"></p><div class="dialog-actions"><button class="button secondary" data-action="close-dialog" data-dialog="confirm-dialog">取消</button><button class="button primary" data-action="confirm">确认</button></div></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript>请使用启用 JavaScript 的浏览器打开灵枢。</noscript>
</body></html>
